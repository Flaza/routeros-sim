[project]
name = "routeros-sim"
version = "1.0.0"
description = "RouterOS Packet Flow Simulator"
requires-python = ">=3.12,<3.13"
dependencies = ["flet==0.27.6", "flet-permission-handler"]

[tool.flet]
org = "com.flaza"
product = "RouterOS Sim"
company = "Flaza"

[tool.flet.app]
path = "src"

[tool.flet.android]
bundle_id = "com.flaza.routerossim"

[tool.flet.android.permission]
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
