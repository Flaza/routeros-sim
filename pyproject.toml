[project]
name = "routeros-sim"
version = "1.0.0"
description = "RouterOS Packet Flow Simulator"
requires-python = ">=3.10"
dependencies = ["flet==0.81.0"]

[tool.flet]
org = "com.flaza"
product = "RouterOS Sim"
company = "Flaza"

[tool.flet.app]
path = "src"

[tool.flet.android]
bundle_id = "com.flaza.routerossim"
extract_packages = ["flet", "serious_python"]
