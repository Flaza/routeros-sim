name: Shipit Cloud Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext build-essential libstdc++6

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv

      - name: Force Accept SDK Licenses
        run: |
          # 1. Принудительно заставляем Buildozer инициализировать структуру папок SDK
          buildozer android runclean || true
          
          # 2. Находим внутренний sdkmanager Бульдозера и скармливаем ему автоматическое "yes" на все лицензии Google
          LOCAL_SDKMANAGER=$(find ~/.buildozer/ -name "sdkmanager" | head -n 1)
          if [ -n "$LOCAL_SDKMANAGER" ]; then
            echo "Found local sdkmanager at $LOCAL_SDKMANAGER. Accepting licenses..."
            yes | $LOCAL_SDKMANAGER --licenses
          else
            echo "Local sdkmanager not found yet, it will be handled by buildozer."
          fi

      - name: Build APK
        run: |
          # Теперь запуск пройдет штатно, так как лицензии уже лежат в папке .buildozer
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: bin/*.apk
          if-no-files-found: error
