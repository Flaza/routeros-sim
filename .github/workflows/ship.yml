name: Shipit Cloud Build (Pure P4A)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext build-essential libstdc++6

      - name: Configure Global Pip (Kill Isolation)
        run: |
          # Создаем глобальный конфиг pip для пользователя runner.
          # Любое изолированное виртуальное окружение (даже внутри python -m build)
          # обязано подчиняться этому файлу и брать пакеты из глобальной системы.
          mkdir -p ~/.config/pip
          echo -e "[global]\nno-build-isolation = false\nno-isolation = true" > ~/.config/pip/pip.conf
          
          # Также дублируем для root, на случай если p4a вызовет сборку через sudo
          sudo mkdir -p /root/.config/pip
          sudo cp ~/.config/pip/pip.conf /root/.config/pip/pip.conf

      - name: Install Python-for-Android and Tools
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" virtualenv build setuptools wheel python-for-android

      - name: Build APK via P4A
        run: |
          export ANDROID_SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          p4a apk \
            --private . \
            --package=org.example.routerossim \
            --name="RouterOS Simulator" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --requirements=python3==3.10.13,hostpython3==3.10.13,kivy,cython \
            --arch=arm64-v8a \
            --permission=INTERNET \
            --sdk-dir=$ANDROID_HOME \
            --ndk-dir=$ANDROID_NDK_LATEST_HOME \
            --android-api=34
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: "*.apk"
          if-no-files-found: error
