name: Shipit Cloud Build (Pure P4A)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext build-essential libstdc++6

      - name: Install Python-for-Android
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" virtualenv build setuptools wheel python-for-android

      - name: Build APK via P4A
        run: |
          # 1. Запускаем p4a на одну секунду, просто чтобы он успел скомпилировать hostpython3 и упасть
          p4a apk --requirements=python3,hostpython3 --arch=arm64-v8a --sdk-dir=$ANDROID_HOME --ndk-dir=$ANDROID_NDK_HOME --android-api=34 || true
          
          # 2. ЖЕСТКИЙ ХАК: Принудительно копируем Cython из системного Python раннера 
          # прямо внутрь site-packages свежесобранного локального hostpython3.
          # Теперь, когда он запустит изоляцию, Cython БУДЕТ внутри его ядра.
          LOCAL_SITE_PACKAGES="/home/runner/.local/share/python-for-android/build/other_builds/hostpython3/desktop/hostpython3/native-build/root/usr/local/lib/python3.10/site-packages"
          if [ -d "$LOCAL_SITE_PACKAGES" ]; then
            echo "Injecting Cython into local hostpython3..."
            cp -r /opt/hostedtoolcache/Python/3.10.*/x64/lib/python3.10/site-packages/Cython* "$LOCAL_SITE_PACKAGES/" || true
            cp -r /opt/hostedtoolcache/Python/3.10.*/x64/lib/python3.10/site-packages/cython* "$LOCAL_SITE_PACKAGES/" || true
          fi
          
          # 3. Указываем путь к рабочему системному sdkmanager
          export ANDROID_SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          # 4. Запускаем финальную сборку. Теперь падения на "No module named Cython" физически быть не может.
          p4a apk \
            --private . \
            --package=org.example.routerossim \
            --name="RouterOS Simulator" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --requirements=python3==3.10.13,hostpython3==3.10.13,kivy,cython \
            --arch=arm64-v8a \
            --permission=INTERNET \
            --sdk-dir=$ANDROID_HOME \
            --ndk-dir=$ANDROID_NDK_HOME \
            --android-api=34
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: "*.apk"
          if-no-files-found: error
