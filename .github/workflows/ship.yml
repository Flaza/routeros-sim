name: Shipit Cloud Build (Pure P4A)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext build-essential libstdc++6

      - name: Install Python-for-Android
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" virtualenv
          pip install python-for-android

      - name: Build APK via P4A
        run: |
          # Перенаправляем p4a на встроенный в GitHub Actions рабочий sdkmanager
          export ANDROID_SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          # Запуск сборки без скачивания утилит
          p4a apk \
            --private . \
            --package=org.example.routerossim \
            --name="RouterOS Simulator" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --requirements=python3==3.10.13,hostpython3==3.10.13,kivy \
            --arch=arm64-v8a \
            --permission=INTERNET \
            --sdk-dir=$ANDROID_HOME \
            --ndk-dir=$ANDROID_NDK_LATEST_HOME \
            --android-api=33
            
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: "*.apk"
          if-no-files-found: error
