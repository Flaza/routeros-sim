name: Shipit Cloud Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext build-essential libstdc++6 aidl

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv

      - name: Pre-build setup for Aidl
        run: |
          # Принудительно создаем структуру папок, которую ищет Buildozer,
          # и копируем системный aidl, чтобы обмануть проверку Android SDK
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
          cp /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
          chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: bin/*.apk
          if-no-files-found: error
