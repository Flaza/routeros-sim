name: Shipit Cloud Build (Fixed Buildozer)

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev \
            gettext build-essential libstdc++6 aidl

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer>=1.5.0" "cython<3.0.0" virtualenv build wheel setuptools

      - name: Prepare Android SDK Paths to Avoid Download Bugs
        run: |
          # Прямо прописываем Бульдозеру использовать системный SDK, где AIDL уже установлен и лицензирован
          sed -i "s|# android.sdk_path =|android.sdk_path = $ANDROID_HOME|" buildozer.spec
          sed -i "s|# android.ndk_path =|android.ndk_path = $ANDROID_NDK_HOME|" buildozer.spec
          sed -i "s|android.auto_update_sdk = True|android.auto_update_sdk = False|" buildozer.spec || true

      - name: Build APK
        env:
          # Включаем железное отключение изоляции для ВСЕХ вложенных процессов pip и build
          PIP_NO_BUILD_ISOLATION: "1"
          PIP_NO_ISOLATION: "1"
          P4A_NO_BUILD_ISOLATION: "1"
        run: |
          # Запуск через чистый buildozer
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: bin/*.apk
          if-no-files-found: error
