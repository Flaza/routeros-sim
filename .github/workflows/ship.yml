name: Shipit Cloud Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Чистый запуск через официальный Docker-контейнер Buildozer
      - name: Build APK with Buildozer Action
        uses: ArtemisB/buildozer-action@v3
        with:
          command: buildozer android debug
          repository_root: .

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: bin/*.apk
          if-no-files-found: error
