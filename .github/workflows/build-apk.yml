name: Build Flet APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: pip install flet --pre -U

      - name: Warmup Flet (install Flutter SDK)
        run: |
          flet build apk --arch arm64-v8a --yes -v || true

      - name: Patch jni version in pub cache
        run: |
          find ~/.pub-cache -type d -name "jni-1.0.*" -exec rm -rf {} + || true
          find ~/.pub-cache -type d -name "jni_flutter-*" -exec rm -rf {} + || true

      - name: Build APK (arm64-v8a)
        run: flet build apk --arch arm64-v8a --yes -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: build/apk/*.apk
          if-no-files-found: error
