name: Build Flet APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: pip install flet --pre -U

      - name: Build APK (arm64-v8a)
        run: flet build apk --arch arm64-v8a -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: build/apk/*.apk
          if-no-files-found: error
