name: Build Flet APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flet
        run: pip install flet --pre -U

      - name: Warmup (generate Flutter project)
        run: |
          flet build apk --arch arm64-v8a --yes -v || true

      - name: Locate generated pubspec.yaml
        run: |
          echo "=== Поиск pubspec.yaml ==="
          find $HOME -name "pubspec.yaml" -not -path "*/.pub-cache/*" 2>/dev/null
          find $GITHUB_WORKSPACE -name "pubspec.yaml" 2>/dev/null
          echo "=== Конец поиска ==="

      - name: Build APK (arm64-v8a)
        run: flet build apk --arch arm64-v8a --yes -v

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: routeros-sim-apk
          path: build/apk/*.apk
          if-no-files-found: error
